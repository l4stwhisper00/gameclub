name: UNO engine tests

on:
  pull_request:
    paths:
      - "supabase/functions/uno-game/**"
      - ".github/workflows/uno-engine-tests.yml"
  push:
    branches:
      - supabase-integration
    paths:
      - "supabase/functions/uno-game/**"
      - ".github/workflows/uno-engine-tests.yml"

jobs:
  uno-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check supabase/functions/uno-game/index.ts
      - name: Run UNO rules tests
        run: deno test supabase/functions/uno-game/engine.test.ts
